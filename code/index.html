<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Something Big</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at bottom, #0b0f2f, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* Center text */
.center-text {
    position: absolute;
    color: white;
    font-size: 2.5rem;
    text-align: center;
    z-index: 10;
    letter-spacing: 2px;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #fff; }
    to   { text-shadow: 0 0 25px #4fc3f7, 0 0 40px #1e88e5; }
}

/* Bubble container */
.bubbles {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* Bubble style */
.bubbles span {
    position: absolute;
    bottom: -100px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    backdrop-filter: blur(2px);
    animation: rise 10s linear infinite;
}

/* Bubble animation */
@keyframes rise {
    0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
    }
}

/* Different bubble sizes + positions */
.bubbles span:nth-child(1) { left: 10%; width: 20px; height: 20px; animation-duration: 8s; }
.bubbles span:nth-child(2) { left: 20%; width: 40px; height: 40px; animation-duration: 12s; }
.bubbles span:nth-child(3) { left: 35%; width: 25px; height: 25px; animation-duration: 9s; }
.bubbles span:nth-child(4) { left: 50%; width: 60px; height: 60px; animation-duration: 14s; }
.bubbles span:nth-child(5) { left: 65%; width: 30px; height: 30px; animation-duration: 10s; }
.bubbles span:nth-child(6) { left: 80%; width: 50px; height: 50px; animation-duration: 11s; }
.bubbles span:nth-child(7) { left: 90%; width: 20px; height: 20px; animation-duration: 7s; }

</style>
</head>

<body>

<div class="center-text">
    SOMETHING BIG IS COMING IN HTML
</div>

<div class="bubbles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

</body>
</html>
