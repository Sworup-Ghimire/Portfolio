<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Maintenance Protocol</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
        }

        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2vw;
            margin: 0;
            margin-bottom: 20px;
            color: #0c0;
            text-shadow: 0 0 10px #0c0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        #bar {
            width: 300px;
            height: 4px;
            border: 1px solid #060;
            position: relative;
        }

        #fill {
            height: 100%;
            background: #0c0;
            box-shadow: 0 0 10px #0c0;
            width: 0%;
            transition: width 0.1s ease;
        }

        #data {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            line-height: 1.4;
            color: rgba(0, 204, 0, 0.6);
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Maintenance underway</h1>
        <div id="bar"><div id="fill"></div></div>
    </div>

    <div id="data">
        System Protocol: ACTIVE<br>
        Core Geometry: OCTAHEDRON<br>
        Flux Rating: STABLE<br>
        Maintenance ID: CF-42
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">

        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.156.1/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Base Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Post-Processing 
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0;
        bloomPass.strength = 2.5; // High intensity for core
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Geometry 
        const coreGeometry = new THREE.OctahedronGeometry(2, 0); 
        const coreMaterial = new THREE.MeshBasicMaterial({ color: 0x00FF00, wireframe: true });
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(core);

        // Data Nodes 
        const nodes = new THREE.Group();
        const nodeGeometry = new THREE.IcosahedronGeometry(0.3, 1);
        const nodeMaterial = new THREE.MeshBasicMaterial({ color: 0x006600, wireframe: true });

        for (let i = 0; i < 4; i++) {
            const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
            // Replicating positions from the image
            if (i === 0) node.position.set(-5, 0, 0); // Left
